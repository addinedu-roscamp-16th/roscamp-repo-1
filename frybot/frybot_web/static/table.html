<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>테이블 주문</title><link rel="stylesheet" href="/static/customer.css"></head><body>
<!-- [수정 2026-11-17] GUI 화면 구성도 초안 v0.1 반영: T1 메뉴 선택 → T2 주문 확인 → T3 진행 상태 →
     T4 음식 도착 안내 → T5 이용 종료. 화면은 테이블 ID(?id=N)에 고정되고 번호를 항상 표시 -->
<div class="screen">
 <div class="bar"><span class="tno" id="tno"></span><span id="tstate" class="sub" style="font-size:15px"></span><span class="sp"></span>
  <button class="link" id="toStatus" type="button" hidden>주문 내역</button><a href="/">처음으로</a></div>

 <div class="stage" id="idle" hidden><h1 id="idleTitle"></h1><div class="sub" id="idleSub"></div></div>

 <div class="wrap" id="t1" hidden>
  <h2>메뉴를 골라 주세요</h2>
  <div class="menu" id="menu"></div>
  <div class="foot"><span>담은 메뉴 <b id="cartCount">0</b>개</span><span class="sp"></span><span class="msg" id="msg" role="status"></span>
   <button class="cta" id="toConfirm" disabled style="min-width:220px;height:64px">주문 확인</button></div>
 </div>

 <div class="wrap" id="t2" hidden>
  <h2>이대로 주문할까요?</h2>
  <div class="panel" style="max-width:none"><div class="lines" id="lines"></div></div>
  <div class="foot"><span>테이블 <b id="confirmTable"></b></span><span class="sp"></span>
   <button class="ghost" id="edit" style="height:64px">수정</button><button class="cta" id="order" style="min-width:220px;height:64px">주문하기</button></div>
 </div>

 <div class="wrap" id="t3" hidden>
  <div id="orders"></div>
  <div class="foot"><span class="note" id="endNote"></span><span class="sp"></span>
   <button class="ghost" id="more" style="height:64px">추가 주문</button><button class="ghost" id="end" style="height:64px" disabled>이용 종료</button></div>
 </div>
</div>

<div class="arrive" id="t4" hidden><div class="panel">
 <div class="sub">음식 도착</div><h1 id="arriveTitle"></h1>
 <div class="note">로봇팔이 음식을 테이블로 옮기고 있어요.<br>옮기는 동안 손을 넣지 말아 주세요.</div>
 <ul class="checks" id="checks"></ul>
</div></div>

<div class="arrive" id="t5" hidden><div class="panel">
 <h1>이용을 마칠까요?</h1>
 <div class="note">종료하면 이 테이블은 정리 후 다음 손님에게 배정돼요. 추가 주문은 할 수 없어요.</div>
 <div class="foot" style="border:0;padding:0;justify-content:center"><button class="ghost" id="keep">계속 이용</button><button class="cta" id="endYes" style="min-width:200px">이용 종료</button></div>
</div></div>
<script src="/static/map.js"></script><script src="/static/ui.js"></script><script>
const $id = id => document.getElementById(id);
const id = +new URLSearchParams(location.search).get('id') || 1;
const qty = {};
let MENU = {}, view = '', wanted = '', visit = null, arriveUntil = 0, arriving = false;
$id('tno').textContent = 'T' + id + ' 테이블';
$id('confirmTable').textContent = 'T' + id;
const ICON = {FRIED: '🍗', SEASONED: '🍗', FRIED_RICE: '🍚'};
const ITEM_KO = {ORDERED: '주문 접수', QUEUED: '조리 순서를 기다리는 중', COOKING: '로봇팔이 조리 중', READY: '서빙 준비 완료',
                 LOADED: '서빙 로봇에 실었어요',  // [수정 2026-11-18] W2: v4 LOADED
                 SERVING: '서빙 로봇이 가는 중', DELIVERED: '전달 완료', ON_HOLD: '잠시 지연되고 있어요'};
const ORDER_STEP = {ORDERED: 0, COOKING: 1, SERVING: 2, COMPLETED: 3};
function show(name) {
  view = name;
  ['idle', 't1', 't2', 't3'].forEach(v => { $id(v).hidden = v !== name; });
}
const cart = () => Object.entries(qty).filter(e => e[1] > 0);
function renderMenu() {
  $id('menu').innerHTML = Object.entries(MENU).map(([k, m]) => '<div class="item"><div class="pic">' + (ICON[k] || '🍽') + '</div><b>' + esc(m.name) +
    '</b><div class="qty"><button type="button" data-menu="' + k + '" data-d="-1">−</button><span>' + (qty[k] || 0) +
    '</span><button type="button" data-menu="' + k + '" data-d="1">+</button></div></div>').join('');
  const n = cart().reduce((s, e) => s + e[1], 0);
  $id('cartCount').textContent = n;
  $id('toConfirm').disabled = !n;
}
$id('menu').addEventListener('click', e => {
  const b = e.target.closest('[data-menu]');
  if (!b) return;
  qty[b.dataset.menu] = Math.max(0, Math.min(5, (qty[b.dataset.menu] || 0) + (+b.dataset.d)));
  $id('msg').textContent = '';
  renderMenu();
});
$id('toConfirm').addEventListener('click', () => {
  $id('lines').innerHTML = cart().map(([k, q]) => '<div><span>' + esc(MENU[k].name) + '</span><b>' + q + '개</b></div>').join('');
  wanted = 't2'; show('t2');
});
$id('edit').addEventListener('click', () => { wanted = 't1'; show('t1'); });
$id('order').addEventListener('click', async () => {
  const button = $id('order');
  button.disabled = true;
  try {
    const r = await postJSON('/api/order', {table_id: id, items: cart().map(([menu, q]) => ({menu, qty: q}))});
    if (r.ok) { for (const k in qty) qty[k] = 0; renderMenu(); wanted = 't3'; show('t3'); }
    else { $id('msg').textContent = r.message || '주문하지 못했어요.'; wanted = 't1'; show('t1'); }
  } catch (error) { $id('msg').textContent = '주문 서버에 연결할 수 없어요.'; wanted = 't1'; show('t1'); }
  finally { button.disabled = false; }
});
$id('more').addEventListener('click', () => { wanted = 't1'; show('t1'); });
$id('toStatus').addEventListener('click', () => { wanted = 't3'; show('t3'); });
$id('end').addEventListener('click', () => { $id('t5').hidden = false; });
$id('keep').addEventListener('click', () => { $id('t5').hidden = true; });
$id('endYes').addEventListener('click', async () => {
  $id('t5').hidden = true;
  try {
    const r = await postJSON('/api/end_use', {table_id: id, source: 'TABLET'});
    $id('endNote').textContent = r.message || '';
  } catch (error) { $id('endNote').textContent = '서버에 연결할 수 없어요.'; }
});
function beep() {
  try {
    const audio = new (window.AudioContext || window.webkitAudioContext)(), osc = audio.createOscillator(), gain = audio.createGain();
    osc.frequency.value = 880; gain.gain.value = 0.08; osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + 0.25);
  } catch (error) { /* 소리를 낼 수 없는 기기 */ }
}
function renderArrival(S) {
  const F = S.fms || {};
  const task = (F.tasks || []).find(t => t.type === 'SERVE' && t.table === id && t.state === 'IN_PROGRESS' &&
    (F.robots || []).some(r => r.id === t.robot && r.state === 'UNLOADING'));
  if (task) {
    if (!arriving) { arriving = true; beep(); }
    $id('arriveTitle').textContent = iGa((MENU[task.menu] || {}).name || '음식') + ' 도착했어요';
    arriveUntil = Date.now() + 4000;
  } else if (arriving && Date.now() > arriveUntil) {
    arriving = false;
  }
  $id('t4').hidden = !arriving;
  if (arriving) {
    $id('checks').innerHTML = '<li class="done"><i></i>서빙 로봇 도착 · 정차 확인</li><li class="' + (task ? 'now' : 'done') +
      '"><i></i>테이블로 옮기는 중</li><li class="' + (task ? '' : 'done') + '"><i></i>전달 완료</li>';
  }
}
async function tick() {
  let S;
  try { S = await getJSON('/api/state'); } catch (error) { return; }
  const R = S.rest || {};
  if (!Object.keys(MENU).length && R.menu) { MENU = R.menu; renderMenu(); }
  const t = (R.tables || []).find(x => x.id === id);
  if (!t) return;
  $id('tstate').textContent = TABLE_KO[t.state] || t.state;
  const inUse = t.state === 'IN_USE' || t.state === 'VACANT_CHECK';
  if (t.visit !== visit) { visit = t.visit; wanted = ''; for (const k in qty) qty[k] = 0; renderMenu(); $id('endNote').textContent = ''; }
  const orders = (R.orders || []).filter(o => o.table === id && o.visit === t.visit);
  $id('toStatus').hidden = !(inUse && orders.length && view !== 't3');
  if (!inUse) {
    $id('t5').hidden = true;
    $id('idleTitle').textContent = {AVAILABLE: '어서 오세요', ASSIGNED: '손님이 오고 계세요', COLLECTING: '테이블을 정리하고 있어요', CLOSED: '지금은 이용할 수 없는 테이블이에요'}[t.state] || '';
    $id('idleSub').textContent = {AVAILABLE: '입구에서 접수하면 안내 로봇이 이 테이블로 모셔 와요.', ASSIGNED: '착석하면 여기에서 주문할 수 있어요.',
      COLLECTING: '이용해 주셔서 감사합니다. 식기를 회수하고 있어요.'}[t.state] || '';
    show('idle');
  } else {
    const next = wanted || (orders.length ? 't3' : 't1');
    if (view !== next) show(next);
    $id('orders').innerHTML = orders.length ? orders.slice().reverse().map(o => {
      const now = ORDER_STEP[o.state];
      return '<div class="ord" style="margin-bottom:14px"><h3>주문 #' + o.id + '<span class="tagc">' + ko(o.state) + '</span></h3><div class="stepper">' +
        ['접수', '조리 중', '서빙', '완료'].map((label, i) => '<div class="' + (now === undefined ? '' : i < now || now === 3 ? 'done' : i === now ? 'now' : '') +
          '"><i></i>' + label + '</div>').join('') + '</div><div class="lines">' + o.items.map(i => '<div><span>' + esc(i.name) + '</span><span class="sub">' +
          (ITEM_KO[i.state] || ko(i.state)) + '</span></div>').join('') + '</div></div>';
    }).join('') : '<div class="panel">주문 내역이 없습니다.</div>';
    $id('end').disabled = !t.can_end;
    if (!$id('endNote').textContent || t.can_end) $id('endNote').textContent = t.can_end ? '' : '모든 음식이 전달된 뒤에 이용을 마칠 수 있어요.';
  }
  renderArrival(S);
}
setInterval(tick, 1000); tick();
</script></body></html>
