# FrybotNavigator: Nav2 parameters of one FrybotMobile (Pinky Pro) in the FryBot store
# (tabletop scale: 2 m x 1 m map, 11 x 12 cm robot). Shared by the simulation and the real robot.
# [수정 2026-11-18] P1(R2-1): "그대로 씀"이 아님. navigator.py 가 실측 지도에서
# FollowPath.use_rotate_to_heading=true, allow_reversing=false 로 덮어쓰고, 초기
# 자세를 주면 amcl 의 set_initial_pose·initial_pose.* 를 덮어씀. 전역 inflation
# 은 __GLOBAL_INFLATION__(실측 지도 0.07, 그 밖 0.08)으로 채움.
# navigator.py fills in the placeholders:
#   __NS__   robot name (pinky1 ...), the namespace of every topic
#   __FP__   TF frame prefix: "pinky1/" in the simulation (one shared /tf), "" on the robot (its own /pinkyN/tf)
#   __SIM__  true with the simulator clock, false on the robot
#   __BT__   path of segment_bt.xml
#   __MAPTOPIC__  /map in the simulation, /pinkyN/map on the robot (its own map_server); __MAP__ = map yaml file
# The central Task Manager decides the route and the order at shared nodes; Nav2 plans and drives each granted
# segment on the costmaps (static map + inflation globally, lidar obstacles locally) and stops before a collision.
bt_navigator:
  ros__parameters:
    use_sim_time: __SIM__
    global_frame: map
    robot_base_frame: __FP__base_footprint
    odom_topic: /__NS__/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: __BT__
    default_nav_through_poses_bt_xml: __BT__
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: __SIM__
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /__NS__/odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    # [수정 2026-11-17] UR-03: 후진 전용 제어기 FollowPathReverse 추가 (이전 값: ["FollowPath"])
    controller_plugins: ["FollowPath", "FollowPathReverse"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 8.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.015
      yaw_goal_tolerance: 6.3
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.08
      lookahead_dist: 0.06
      min_lookahead_dist: 0.04
      max_lookahead_dist: 0.10
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 6.0
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.05
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.3
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.05
      regulated_linear_scaling_min_speed: 0.03
      # The AMR node turns the robot toward each node itself (front for forward driving, rear for reverse) before
      # sending the goal, so the controller only drives. Reversing (guiding, yielding, backing out after a replan)
      # follows the sign of the carrot in the robot frame; RPP does not allow it together with rotate-to-heading.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.4
      allow_reversing: true
      max_robot_pose_search_dist: 0.5
    # [수정 2026-11-17] UR-03: 후진 전용 제어기. 실측 지도에서는 navigator.py 가 FollowPath 를 전진 전용
    # (use_rotate_to_heading: true, allow_reversing: false)으로 덮어쓰므로, 손님 안내 구간(후진)은 이 제어기로
    # 주행한다. AMR 노드가 구간마다 controller_selector 토픽으로 고른다. 값은 위 FollowPath 와 같다.
    FollowPathReverse:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.08
      lookahead_dist: 0.06
      min_lookahead_dist: 0.04
      max_lookahead_dist: 0.10
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 6.0
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.05
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.3
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.05
      regulated_linear_scaling_min_speed: 0.03
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.4
      allow_reversing: true
      max_robot_pose_search_dist: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: __SIM__
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: __FP__odom
      robot_base_frame: __FP__base_footprint
      rolling_window: true
      initial_transform_timeout: 900.0   # wait this long for odom -> base before giving up (default 60 s)
      width: 1
      height: 1
      resolution: 0.01
      footprint: "[[0.062, 0.057], [0.062, -0.057], [-0.062, -0.057], [-0.062, 0.057]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /__NS__/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 0.6
          obstacle_min_range: 0.06      # the lidar clamps to 0.05 m: ignore clamped returns
          raytrace_max_range: 0.8
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.07
        cost_scaling_factor: 40.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: __SIM__
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: __FP__base_footprint
      resolution: 0.01
      track_unknown_space: false
      # Without an initial pose AMCL publishes no map -> odom. The default (60 s) made the whole Nav2 bring-up
      # abort when the pose was set later than that; wait up to 15 min instead.
      initial_transform_timeout: 900.0
      footprint: "[[0.062, 0.057], [0.062, -0.057], [-0.062, -0.057], [-0.062, 0.057]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: __MAPTOPIC__
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: __GLOBAL_INFLATION__
        cost_scaling_factor: 30.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: __SIM__
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.02
      use_astar: true
      allow_unknown: false

# ---- precise docking (opennav_docking): chargers, pick-up spots and dish return on their ArUco wall marker, table
# stops on the map pose. The FrybotMobile Controller calls dock_robot from the roadmap node just before the dock
# (the robot is already there, so the server never navigates to a staging pose itself) and passes the dock pose with
# the goal; frybot_control.layout.docks() is the list of docks.
docking_server:
  ros__parameters:
    use_sim_time: __SIM__
    controller_frequency: 20.0
    initial_perception_timeout: 4.0     # s to find the marker before the attempt fails
    dock_approach_timeout: 20.0
    wait_charge_timeout: 2.0
    max_retries: 0                      # a retry backs up to the staging pose; the controller falls back to Nav2 instead
    base_frame: __FP__base_footprint
    fixed_frame: __FP__odom
    dock_backwards: false               # the camera looks forward: always dock nose first
    dock_prestaging_tolerance: 0.2
    dock_plugins: ["marker_dock", "pose_dock"]
    marker_dock:                        # dock pose = what the ArUco detector publishes on detected_dock_pose
      plugin: "opennav_docking::SimpleNonChargingDock"
      use_external_detection_pose: true
      external_detection_timeout: 1.0   # the detector repeats the last pose (odometry frame) while the marker is hidden
      # the detector already publishes the pose the robot must reach: no offset from the detection
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.3
      # Docked when the base is this close to the dock pose (m). The FrybotMobile Controller also ends the approach
      # when the robot is level with the dock pose (it may be a few mm to the side and never get this close).
      docking_threshold: 0.006
      staging_x_offset: -0.16           # the roadmap node before a dock is about this far in front of it
      staging_yaw_offset: 0.0
    pose_dock:                          # no marker (table stops): the dock pose from the map is used as it is
      plugin: "opennav_docking::SimpleNonChargingDock"
      use_external_detection_pose: false
      docking_threshold: 0.006
      staging_x_offset: -0.05
      staging_yaw_offset: 0.0
    controller:
      # The server aims 0.25 m behind the dock pose, and the approach is only 5-16 cm long: with the default gains
      # (3, 2) two thirds of a sideways offset at the start were still there at the dock. Higher gains pull the robot
      # onto the dock's centre line within a few cm.
      k_phi: 8.0
      k_delta: 4.0
      v_linear_min: 0.02
      v_linear_max: 0.05
      v_angular_max: 1.0
      slowdown_radius: 0.10
      # Collision check of the approach on the local costmap, except close to the dock: a dock is right in front of a
      # wall, a counter or a table, which the costmap marks as an obstacle. The distance is measured from the
      # controller's target, which the server puts 0.25 m BEHIND the dock pose, so 0.33 = the last 8 cm before the
      # dock are not checked (the server's default 0.30 = last 5 cm).
      use_collision_detection: true
      dock_collision_threshold: 0.33
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.3
      projection_time: 2.0
      simulation_time_step: 0.1

# ---- localisation, real robot only (the simulation takes the pose from the simulator instead)
map_server:
  ros__parameters:
    use_sim_time: __SIM__
    yaml_filename: "__MAP__"

amcl:
  ros__parameters:
    use_sim_time: __SIM__
    base_frame_id: __FP__base_footprint
    odom_frame_id: __FP__odom
    global_frame_id: map
    scan_topic: /__NS__/scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 0.5      # the whole map is 2 m x 1 m
    laser_max_range: 3.0
    laser_min_range: 0.06
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.02                  # 2 cm / 0.1 rad: the roadmap segments are only 10-30 cm long
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    # [수정 2026-11-18] P1(R2-1): 가상 매장 도면에서만 제어기가 홈 자세를 보냄.
    # 실측 지도는 robot.launch.py 의 initial_pose:= 나 RViz 2D Pose Estimate
    set_initial_pose: false
