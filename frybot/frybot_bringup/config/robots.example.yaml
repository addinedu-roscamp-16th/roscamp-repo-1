# [수정 2026-11-18] T-30: 비밀번호 없는 로봇 등록부 예시.
# 실제 등록부는 저장소 밖에 둡니다. 이 파일을 복사해 값을 채우세요.
#   mkdir -p ~/.config/frybot && chmod 700 ~/.config/frybot
#   cp <이 파일> ~/.config/frybot/robots.yaml && chmod 600 ~/.config/frybot/robots.yaml
# 쓰는 곳:
#   ros2 launch frybot_bringup real.launch.py map_id:=test_map_v001     -> 등록된 로봇을 모두 기동
#   ros2 run frybot_bringup robot_remote --all --check                  -> 접속·설치 상태 점검
# 로봇 이름은 pinky1, pinky2, ... 순서여야 합니다(robots:=N 은 앞에서부터 N대).
# SSH 키를 로봇에 등록(ssh-copy-id)했다면 password 는 비워 둡니다.
defaults:
  user: pinky
  password: ""                  # SSH 비밀번호. 키 접속이 되면 비워 둠
  port: 22
  workspace: ~/frybot_robot_ws   # 로봇 안의 작업 공간 (install/setup.bash 가 있는 곳)
  ros_setup: /opt/ros/jazzy/setup.bash
  domain_id: auto               # auto = 관제 PC의 ROS_DOMAIN_ID 를 그대로 넘김. 숫자를 쓰면 그 값
  launch_args: {}               # robot.launch.py 에 더 넘길 인자, 예: {speed: "0.06"}
robots:
  pinky1:
    host: 192.168.0.101         # 예시 주소
  pinky2:
    host: 192.168.0.102
    # initial_pose: "0.66 -0.58 1.57"   # 지도 좌표 x y yaw(rad). 없으면 RViz 2D Pose Estimate 로 지정
    # enabled: false                     # 잠시 빼 둘 로봇
