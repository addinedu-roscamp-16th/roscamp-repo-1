<body>
<div style="width: 100%; height: 100%; border-radius: 24px; background: rgb(255, 255, 255); overflow: hidden; display: flex; flex-direction: column;">

            <span style="font-size: 17px; font-weight: 700;">OneTeam 레스토랑</span>
            <div aria-label="3단계 중 2단계" style="margin-left: auto; display: flex; gap: 6px;">
              <span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(240, 100, 15);"></span><span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(240, 100, 15);"></span><span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(227, 230, 235);"></span>

                T5 테이블은 맡아 두었어요
              </div>
              <div style="font-size: 40px; font-weight: 800; line-height: 1.3;">로봇이 모두 안내 중이에요<br>조금만 기다려 주세요</div>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0px, 1fr)); gap: 12px;">
                <div style="border-radius: 22px; background: rgb(244, 245, 247); padding: 20px 24px; display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 16px; color: rgb(92, 99, 112);">대기 순번</span><b style="font-size: 38px; font-weight: 800;">2번째</b></div>

              </div>
            </div>
            <div style="border-radius: 28px; background: radial-gradient(120% 70% at 50% 100%, rgb(255, 227, 207) 0%, rgb(255, 244, 236) 55%, rgb(255, 248, 243) 100%); position: relative; display: flex; align-items: flex-end; justify-content: center;">
              <div style="position: absolute; left: 24px; top: 24px; padding: 10px 16px; border-radius: 16px 16px 16px 4px; background: rgb(255, 255, 255); font-size: 17px; font-weight: 700; box-shadow: rgba(25, 28, 33, 0.06) 0px 2px 8px;">금방 갈게요!</div>
              <svg width="210" height="252" viewBox="0 0 200 240" aria-hidden="true" style="margin-bottom: 8px;"><defs><radialGradient id="rk3w" cx="0.34" cy="0.28" r="0.85"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.55" stop-color="#F0F2F6"></stop><stop offset="1" stop-color="#C3CAD5"></stop></radialGradient><linearGradient id="rk3arm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.5" stop-color="#E8EBF0"></stop><stop offset="1" stop-color="#B8C0CC"></stop></linearGradient><radialGradient id="rk3o" cx="0.32" cy="0.28" r="0.8"><stop offset="0" stop-color="#FFC59E"></stop><stop offset="0.45" stop-color="#F57A2E"></stop><stop offset="1" stop-color="#B93C0A"></stop></radialGradient><linearGradient id="rk3v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C4456"></stop><stop offset="1" stop-color="#0F1218"></stop></linearGradient><radialGradient id="rk3e" cx="0.5" cy="0.4" r="0.65"><stop offset="0" stop-color="#EEFCFF"></stop><stop offset="0.45" stop-color="#8BE6FF"></stop><stop offset="1" stop-color="#22AEE0"></stop></radialGradient><linearGradient id="rk3m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9ECF1"></stop><stop offset="1" stop-color="#9EA7B4"></stop></linearGradient><radialGradient id="rk3sh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3A2A1E" stop-opacity="0.32"></stop><stop offset="1" stop-color="#3A2A1E" stop-opacity="0"></stop></radialGradient><filter id="rk3glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"></feGaussianBlur></filter><filter id="rk3soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter></defs><ellipse cx="100" cy="229" rx="72" ry="12" fill="url(#rk3sh)"></ellipse><path d="M58 132 h84 a16 16 0 0 1 16 16 v54 a24 24 0 0 1 -24 24 h-68 a24 24 0 0 1 -24 -24 v-54 a16 16 0 0 1 16 -16z" fill="url(#rk3w)"></path><ellipse cx="100" cy="138" rx="42" ry="7" fill="#7E8896" opacity="0.35" filter="url(#rk3soft)"></ellipse><rect x="88" y="120" width="24" height="18" rx="7" fill="url(#rk3m)"></rect><ellipse cx="100" cy="158" rx="66" ry="6" fill="#5A4636" opacity="0.18" filter="url(#rk3soft)"></ellipse><path d="M52 150 a22 22 0 0 1 44 0z" fill="url(#rk3w)"></path><circle cx="74" cy="126" r="4" fill="url(#rk3m)"></circle><ellipse cx="66" cy="138" rx="5" ry="3" fill="#FFFFFF" opacity="0.9"></ellipse><path d="M104 150 a22 22 0 0 1 44 0z" fill="url(#rk3w)"></path><circle cx="126" cy="126" r="4" fill="url(#rk3m)"></circle><ellipse cx="118" cy="138" rx="5" ry="3" fill="#FFFFFF" opacity="0.9"></ellipse><rect x="36" y="148" width="128" height="10" rx="5" fill="url(#rk3m)"></rect><rect x="28" y="152" width="20" height="32" rx="10" fill="url(#rk3arm)"></rect><rect x="152" y="152" width="20" height="32" rx="10" fill="url(#rk3arm)"></rect><path d="M100 42 v-18" stroke="url(#rk3m)" stroke-width="5" stroke-linecap="round"></path><circle cx="100" cy="20" r="9" fill="url(#rk3o)"></circle><ellipse cx="97" cy="16" rx="3" ry="2" fill="#FFFFFF" opacity="0.75"></ellipse><rect x="24" y="68" width="18" height="32" rx="9" fill="url(#rk3o)"></rect><rect x="158" y="68" width="18" height="32" rx="9" fill="url(#rk3o)"></rect><ellipse cx="30" cy="76" rx="3" ry="5" fill="#FFFFFF" opacity="0.5"></ellipse><rect x="36" y="38" width="128" height="92" rx="42" fill="url(#rk3w)"></rect><ellipse cx="74" cy="48" rx="22" ry="6" fill="#FFFFFF" opacity="0.9" filter="url(#rk3soft)"></ellipse><rect x="49" y="53" width="102" height="62" rx="29" fill="url(#rk3v)"></rect><path d="M62 64 q38 -14 76 0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.16"></path><g opacity="0.85" filter="url(#rk3glow)"><rect x="67" y="72" width="24" height="8" rx="4" fill="#5FD8FF"></rect><rect x="109" y="72" width="24" height="8" rx="4" fill="#5FD8FF"></rect></g><rect x="67" y="72" width="24" height="8" rx="4" fill="url(#rk3e)"></rect><rect x="109" y="72" width="24" height="8" rx="4" fill="url(#rk3e)"></rect><circle cx="100" cy="99" r="5" fill="none" stroke="#8BE6FF" stroke-width="3.5"></circle><path d="M174 30 q9 13 0 20 q-9 -7 0 -20z" fill="#8FD3FF"></path><ellipse cx="172" cy="42" rx="1.6" ry="2.6" fill="#FFFFFF" opacity="0.8"></ellipse></svg>
            </div>
          </div>
          <div style="flex-shrink: 0; box-sizing: border-box; padding: 24px 40px 32px; display: flex; align-items: center; gap: 12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16 V11 a6 6 0 0 1 12 0 v5 l1.5 2 h-15z" fill="none" stroke="#5C6370" stroke-width="2" stroke-linejoin="round"></path><path d="M10 20.5 a2 2 0 0 0 4 0" fill="none" stroke="#5C6370" stroke-width="2" stroke-linecap="round"></path></svg>
            <span style="font-size: 16px; color: rgb(92, 99, 112);">로봇이 도착하면 화면과 소리로 알려 드려요</span>
            <button style="margin-left: auto; height: 64px; padding: 0px 32px; border-radius: 18px; border: 0px; background: rgb(244, 245, 247); color: rgb(58, 64, 75); font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 19px; font-weight: 700;">처음으로</button>
          </div>
        </div>

</html>
