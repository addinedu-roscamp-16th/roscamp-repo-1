<!doctype html>
<html lang="ko">
<head>

<title>K1 인원선택</title>

<style>

<body>
<div style="width: 100%; height: 100%; border-radius: 24px; background: rgb(255, 255, 255); overflow: hidden; display: flex; flex-direction: column;">
          <div style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0px 32px; display: flex; align-items: center; gap: 12px;">

            <span style="font-size: 17px; font-weight: 700;">OneTeam 레스토랑</span>
            <div aria-label="3단계 중 1단계" style="margin-left: auto; display: flex; gap: 6px;">
              <span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(240, 100, 15);"></span><span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(227, 230, 235);"></span><span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(227, 230, 235);"></span>
            </div>
            <button style="margin-left: 16px; height: 44px; padding: 0px 18px; border-radius: 12px; border: 0px; background: rgb(244, 245, 247); color: rgb(58, 64, 75); font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 15px; font-weight: 700;">직원 호출</button>

              <div style="display: flex; flex-direction: column; gap: 10px;">

                <div style="font-size: 18px; color: rgb(92, 99, 112);">인원에 맞는 자리를 바로 찾아 드릴게요</div>
              </div>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0px, 1fr)); gap: 12px;">
                <button style="height: 120px; border-radius: 22px; border: 3px solid transparent; background: rgb(244, 245, 247); color: rgb(25, 28, 33); font: inherit; display: flex; flex-wrap: wrap; align-content: center; align-items: baseline; justify-content: center; gap: 2px;"><span style="font-size: 44px; font-weight: 800;">1</span><span style="font-size: 18px; font-weight: 700;">명</span></button>
                <button style="height: 120px; border-radius: 22px; border: 3px solid transparent; background: rgb(244, 245, 247); color: rgb(25, 28, 33); font: inherit; display: flex; flex-wrap: wrap; align-content: center; align-items: baseline; justify-content: center; gap: 2px;"><span style="font-size: 44px; font-weight: 800;">2</span><span style="font-size: 18px; font-weight: 700;">명</span></button>
                <button style="height: 120px; border-radius: 22px; border: 3px solid transparent; background: rgb(244, 245, 247); color: rgb(25, 28, 33); font: inherit; display: flex; flex-wrap: wrap; align-content: center; align-items: baseline; justify-content: center; gap: 2px;"><span style="font-size: 44px; font-weight: 800;">3</span><span style="font-size: 18px; font-weight: 700;">명</span></button>
                <button aria-pressed="true" style="height: 120px; border-radius: 22px; border: 3px solid rgb(240, 100, 15); background: rgb(255, 241, 231); color: rgb(194, 65, 12); font: inherit; display: flex; flex-wrap: wrap; align-content: center; align-items: baseline; justify-content: center; gap: 2px;"><span style="font-size: 44px; font-weight: 800;">4</span><span style="font-size: 18px; font-weight: 700;">명</span></button>
              </div>
              <div style="font-size: 15px; color: rgb(92, 99, 112);">5명 이상이면 오른쪽 위 <b style="color: rgb(58, 64, 75);">직원 호출</b>을 눌러 주세요</div>
            </div>

              <div style="position: absolute; left: 24px; top: 24px; padding: 10px 16px; border-radius: 16px 16px 16px 4px; background: rgb(255, 255, 255); font-size: 17px; font-weight: 700; box-shadow: rgba(25, 28, 33, 0.06) 0px 2px 8px;">반가워요!</div>

 d="M58 132 h84 a16 16 0 0 1 16 16 v54 a24 24 0 0 1 -24 24 h-68 a24 24 0 0 1 -24 -24 v-54 a16 16 0 0 1 16 -16z" fill="url(#rk1w)"></path><ellipse cx="100" cy="138" rx="42" ry="7" fill="#7E8896" opacity="0.35" filter="url(#rk1soft)"></ellipse><rect x="88" y="120" width="24" height="18" rx="7" fill="url(#rk1m)"></rect><rect x="78" y="160" width="44" height="10" rx="5" fill="url(#rk1o)"></rect><rect x="84" y="161.5" width="16" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"></rect><path d="M100 42 v-18" stroke="url(#rk1m)" stroke-width="5" stroke-linecap="round"></path><circle cx="100" cy="20" r="9" fill="url(#rk1o)"></circle><ellipse cx="97" cy="16" rx="3" ry="2" fill="#FFFFFF" opacity="0.75"></ellipse><rect x="24" y="68" width="18" height="32" rx="9" fill="url(#rk1o)"></rect><rect x="158" y="68" width="18" height="32" rx="9" fill="url(#rk1o)"></rect><ellipse cx="30" cy="76" rx="3" ry="5" fill="#FFFFFF" opacity="0.5"></ellipse><rect x="36" y="38" width="128" height="92" rx="42" fill="url(#rk1w)"></rect><ellipse cx="74" cy="48" rx="22" ry="6" fill="#FFFFFF" opacity="0.9" filter="url(#rk1soft)"></ellipse><rect x="49" y="53" width="102" height="62" rx="29" fill="url(#rk1v)"></rect><path d="M62 64 q38 -14 76 0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.16"></path><g opacity="0.85" filter="url(#rk1glow)"><rect x="71" y="68" width="16" height="22" rx="8" fill="#5FD8FF"></rect><rect x="113" y="68" width="16" height="22" rx="8" fill="#5FD8FF"></rect></g><rect x="71" y="68" width="16" height="22" rx="8" fill="url(#rk1e)"></rect><rect x="113" y="68" width="16" height="22" rx="8" fill="url(#rk1e)"></rect><ellipse cx="76" cy="73" rx="2.5" ry="3" fill="#FFFFFF"></ellipse><ellipse cx="118" cy="73" rx="2.5" ry="3" fill="#FFFFFF"></ellipse><path d="M88 98 q12 9 24 0" stroke="#8BE6FF" stroke-width="4" fill="none" stroke-linecap="round"></path><circle cx="61" cy="99" r="6" fill="#FF8A5C" opacity="0.55" filter="url(#rk1glow)"></circle><circle cx="139" cy="99" r="6" fill="#FF8A5C" opacity="0.55" filter="url(#rk1glow)"></circle></svg>
            </div>
          </div>
          <div style="flex-shrink: 0; box-sizing: border-box; padding: 24px 40px 32px;">
            <button style="width: 100%; height: 76px; border-radius: 20px; border: 0px; background: rgb(240, 100, 15); color: rgb(255, 255, 255); font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 24px; font-weight: 700;">4명으로 자리 찾기</button>
          </div>
        </div>
