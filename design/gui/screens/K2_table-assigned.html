<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2 테이블배정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; background: #E9EBEF; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.02em; }
  button { cursor: pointer; }
</style>
</head>
<body>
<div style="width: 100%; height: 100%; border-radius: 24px; background: rgb(255, 255, 255); overflow: hidden; display: flex; flex-direction: column;">
          <div style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0px 32px; display: flex; align-items: center; gap: 12px;">
            <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="9" fill="#F0640F"></rect><circle cx="14" cy="14" r="6" fill="none" stroke="#FFFFFF" stroke-width="3"></circle></svg>
            <span style="font-size: 17px; font-weight: 700;">OneTeam 레스토랑</span>
            <div aria-label="3단계 중 2단계" style="margin-left: auto; display: flex; gap: 6px;">
              <span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(240, 100, 15);"></span><span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(240, 100, 15);"></span><span style="width: 28px; height: 6px; border-radius: 3px; background: rgb(227, 230, 235);"></span>
            </div>
            <button style="margin-left: 16px; height: 44px; padding: 0px 18px; border-radius: 12px; border: 0px; background: rgb(244, 245, 247); color: rgb(58, 64, 75); font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 15px; font-weight: 700;">직원 호출</button>
          </div>
          <div style="flex-grow: 1; box-sizing: border-box; padding: 12px 40px 0px; display: grid; grid-template-columns: minmax(0px, 1fr) 400px; gap: 32px;">
            <div style="display: flex; flex-direction: column; gap: 20px;">
              <div style="font-size: 18px; font-weight: 700; color: rgb(194, 65, 12);">자리를 찾았어요</div>
              <div style="font-size: 44px; font-weight: 800; line-height: 1.25;"><span style="color: rgb(194, 65, 12);">T5</span> 테이블로<br>모실게요</div>
              <div style="display: flex; gap: 8px;">
                <span style="padding: 8px 14px; border-radius: 10px; background: rgb(244, 245, 247); font-size: 15px; font-weight: 700; color: rgb(58, 64, 75);">4인석</span>
                <span style="padding: 8px 14px; border-radius: 10px; background: rgb(244, 245, 247); font-size: 15px; font-weight: 700; color: rgb(58, 64, 75);">4명</span>
              </div>
              <div style="margin-top: auto; border-radius: 22px; background: rgb(244, 245, 247); padding: 18px 20px; display: flex; align-items: center; gap: 16px;">
                <svg width="56" height="50" viewBox="20 8 160 128" aria-hidden="true"><defs><radialGradient id="rk2w" cx="0.34" cy="0.28" r="0.85"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.55" stop-color="#F0F2F6"></stop><stop offset="1" stop-color="#C3CAD5"></stop></radialGradient><linearGradient id="rk2arm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.5" stop-color="#E8EBF0"></stop><stop offset="1" stop-color="#B8C0CC"></stop></linearGradient><radialGradient id="rk2o" cx="0.32" cy="0.28" r="0.8"><stop offset="0" stop-color="#FFC59E"></stop><stop offset="0.45" stop-color="#F57A2E"></stop><stop offset="1" stop-color="#B93C0A"></stop></radialGradient><linearGradient id="rk2v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C4456"></stop><stop offset="1" stop-color="#0F1218"></stop></linearGradient><radialGradient id="rk2e" cx="0.5" cy="0.4" r="0.65"><stop offset="0" stop-color="#EEFCFF"></stop><stop offset="0.45" stop-color="#8BE6FF"></stop><stop offset="1" stop-color="#22AEE0"></stop></radialGradient><linearGradient id="rk2m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9ECF1"></stop><stop offset="1" stop-color="#9EA7B4"></stop></linearGradient><radialGradient id="rk2sh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3A2A1E" stop-opacity="0.32"></stop><stop offset="1" stop-color="#3A2A1E" stop-opacity="0"></stop></radialGradient><filter id="rk2glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"></feGaussianBlur></filter><filter id="rk2soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter></defs><path d="M100 42 v-18" stroke="url(#rk2m)" stroke-width="5" stroke-linecap="round"></path><circle cx="100" cy="20" r="9" fill="url(#rk2o)"></circle><ellipse cx="97" cy="16" rx="3" ry="2" fill="#FFFFFF" opacity="0.75"></ellipse><rect x="24" y="68" width="18" height="32" rx="9" fill="url(#rk2o)"></rect><rect x="158" y="68" width="18" height="32" rx="9" fill="url(#rk2o)"></rect><ellipse cx="30" cy="76" rx="3" ry="5" fill="#FFFFFF" opacity="0.5"></ellipse><rect x="36" y="38" width="128" height="92" rx="42" fill="url(#rk2w)"></rect><ellipse cx="74" cy="48" rx="22" ry="6" fill="#FFFFFF" opacity="0.9" filter="url(#rk2soft)"></ellipse><rect x="49" y="53" width="102" height="62" rx="29" fill="url(#rk2v)"></rect><path d="M62 64 q38 -14 76 0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.16"></path><g opacity="0.85" filter="url(#rk2glow)"><rect x="77" y="70" width="16" height="22" rx="8" fill="#5FD8FF"></rect><rect x="119" y="70" width="16" height="22" rx="8" fill="#5FD8FF"></rect></g><rect x="77" y="70" width="16" height="22" rx="8" fill="url(#rk2e)"></rect><rect x="119" y="70" width="16" height="22" rx="8" fill="url(#rk2e)"></rect><ellipse cx="82" cy="75" rx="2.5" ry="3" fill="#FFFFFF"></ellipse><ellipse cx="124" cy="75" rx="2.5" ry="3" fill="#FFFFFF"></ellipse></svg>
                <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
                  <div style="display: flex; align-items: baseline; gap: 8px;"><b style="font-size: 19px;">안내 로봇이 오고 있어요</b><span style="font-size: 15px; color: rgb(92, 99, 112);">약 30초</span></div>
                  <div style="height: 8px; border-radius: 4px; background: rgb(227, 230, 235); overflow: hidden;"><div style="width: 40%; height: 100%; border-radius: 4px; background: rgb(240, 100, 15);"></div></div>
                </div>
              </div>
            </div>
            <div style="border-radius: 28px; background: rgb(244, 245, 247); display: flex; align-items: center; justify-content: center;">
              <svg width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="매장 배치도. 입구에서 T5 테이블까지 가는 길" style="font-family: &quot;Noto Sans KR&quot;, sans-serif;">
                <rect x="40" y="36" width="76" height="52" rx="14" fill="#DDE1E7"></rect>
                <rect x="142" y="36" width="76" height="52" rx="14" fill="#DDE1E7"></rect>
                <rect x="244" y="36" width="76" height="52" rx="14" fill="#DDE1E7"></rect>
                <rect x="40" y="128" width="76" height="52" rx="14" fill="#DDE1E7"></rect>
                <rect x="142" y="128" width="76" height="52" rx="14" fill="#F0640F"></rect>
                <rect x="244" y="128" width="76" height="52" rx="14" fill="#DDE1E7"></rect>
                <text x="180" y="161" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">T5</text>
                <path d="M78 262 V220 H180 V186" stroke="#F0640F" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none"></path>
                <circle cx="78" cy="262" r="12" fill="#191C21"></circle>
                <circle cx="78" cy="262" r="5" fill="#FFFFFF"></circle>
                <text x="100" y="268" font-size="16" font-weight="700" fill="#3A404B">입구 · 지금 여기</text>
              </svg>
            </div>
          </div>
          <div style="flex-shrink: 0; box-sizing: border-box; padding: 24px 40px 32px; display: flex; align-items: center; gap: 16px;">
            <span style="font-size: 16px; color: rgb(92, 99, 112);">로봇이 오면 다음 화면으로 자동으로 넘어가요</span>
            <button style="margin-left: auto; height: 64px; padding: 0px 32px; border-radius: 18px; border: 0px; background: rgb(244, 245, 247); color: rgb(58, 64, 75); font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 19px; font-weight: 700;">처음으로</button>
          </div>
        </div>
</body>
</html>
